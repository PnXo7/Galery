name: Importar fotos desde Instagram (una sola vez)

on:
  push:
    branches: ["arena/45a7dc7d-galery"]
    paths: [".github/workflows/import-ig.yml", "ig-urls.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar fotos (URLs CDN de Instagram)
        run: |
          mkdir -p ig-photos
          python3 - <<'PY'
          import urllib.request, pathlib
          UA = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}
          resumen = []
          for line in pathlib.Path('ig-urls.txt').read_text().splitlines():
              line = line.strip()
              if not line or '|' not in line:
                  continue
              name, url = line.split('|', 1)
              out = pathlib.Path('ig-photos') / name
              try:
                  req = urllib.request.Request(url, headers=UA)
                  data = urllib.request.urlopen(req, timeout=30).read()
                  out.write_bytes(data)
                  ok = len(data) > 8000
                  resumen.append(f"{name}: {'OK' if ok else 'SOSPECHOSO'} {len(data)} bytes")
                  if not ok:
                      out.unlink(missing_ok=True)
              except Exception as e:
                  resumen.append(f"{name}: ERROR {e}")
          pathlib.Path('ig-photos/RESUMEN.txt').write_text("\n".join(resumen) + "\n")
          print("\n".join(resumen))
          PY
      - name: Guardar fotos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ig-photos/
          git commit -m "Fotos importadas desde Instagram @fotografiainolvidable" || echo "Sin cambios"
          git push
