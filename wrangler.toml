name = "inolvidable-fotografia"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"

# Bindings (declarados aquí porque al existir wrangler.toml, el panel
# de Cloudflare deshabilita el botón "Add" en Settings -> Bindings):
#   DB     -> D1  inolvidable-db
#   BUCKET -> R2  inolvidable-fotos
[[d1_databases]]
binding = "DB"
database_name = "inolvidable-db"
database_id = "9d99d522-13a2-4436-9fee-5089d3d10eb4"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "inolvidable-fotos"
